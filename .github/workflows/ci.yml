name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: detect affected images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      docker: ${{ steps.matrix.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed runtime areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # New files under a package directory match automatically. Keep
          # root-level files that Dockerfiles COPY explicitly (for example
          # tts_cli.py) in the owning filter below; shared voicepipe/ and
          # instrumentation changes intentionally rebuild every affected
          # service image.
          filters: |
            stt:
              - 'services/stt/**'
              - 'services/stt/Dockerfile'
              - 'voicepipe/**'
              - 'services/metrics.py'
              - 'services/telemetry.py'
              - '.dockerignore'
            tts:
              - 'services/tts/**'
              - 'services/tts/Dockerfile'
              - 'voicepipe/**'
              - 'services/metrics.py'
              - 'services/telemetry.py'
              - 'requirements/chatterbox.txt'
              - 'requirements/uma-tts.txt'
              - 'requirements/kokoro.txt'
              - 'tts_cli.py'
              - 'chatterbox_cli.py'
              - '.dockerignore'
            agent:
              - 'services/agent/**'
              - 'services/agent/Dockerfile'
              - 'voicepipe/**'
              - 'tools/companion_control_mcp.py'
              - 'services/metrics.py'
              - 'services/telemetry.py'
              - '.dockerignore'
            gateway:
              - 'services/gateway/**'
              - 'services/gateway/Dockerfile'
              - 'voicepipe/**'
              - 'services/metrics.py'
              - 'services/telemetry.py'
              - '.dockerignore'
            scheduler:
              - 'controller/gpu_scheduler/**'
              - '.dockerignore'
            gpuexporter:
              - 'services/gpu_exporter/**'
              - '.dockerignore'
      - name: Build affected image matrix
        id: matrix
        env:
          STT: ${{ steps.filter.outputs.stt }}
          TTS: ${{ steps.filter.outputs.tts }}
          AGENT: ${{ steps.filter.outputs.agent }}
          GATEWAY: ${{ steps.filter.outputs.gateway }}
          SCHEDULER: ${{ steps.filter.outputs.scheduler }}
          GPUEXPORTER: ${{ steps.filter.outputs.gpuexporter }}
        run: |
          matrix='{"include":[]}'
          if [ "$STT" = true ]; then
            matrix=$(jq -c '.include += [{"image":"aicompanion-stt","dockerfile":"services/stt/Dockerfile","build-args":""}]' <<<"$matrix")
          fi
          if [ "$TTS" = true ]; then
            matrix=$(jq -c '.include += [
              {"image":"aicompanion-tts","dockerfile":"services/tts/Dockerfile","build-args":"REQUIREMENTS_FILE=chatterbox.txt"},
              {"image":"aicompanion-tts-vits","dockerfile":"services/tts/Dockerfile","build-args":"REQUIREMENTS_FILE=uma-tts.txt"},
              {"image":"aicompanion-tts-kokoro","dockerfile":"services/tts/Dockerfile","build-args":"REQUIREMENTS_FILE=kokoro.txt"}
            ]' <<<"$matrix")
          fi
          if [ "$AGENT" = true ]; then
            matrix=$(jq -c '.include += [{"image":"aicompanion-agent","dockerfile":"services/agent/Dockerfile","build-args":""}]' <<<"$matrix")
          fi
          if [ "$GATEWAY" = true ]; then
            matrix=$(jq -c '.include += [{"image":"aicompanion-gateway","dockerfile":"services/gateway/Dockerfile","build-args":""}]' <<<"$matrix")
          fi
          if [ "$SCHEDULER" = true ]; then
            matrix=$(jq -c '.include += [{"image":"aicompanion-gpu-scheduler","dockerfile":"controller/gpu_scheduler/Dockerfile","context":"controller/gpu_scheduler","build-args":""}]' <<<"$matrix")
          fi
          if [ "$GPUEXPORTER" = true ]; then
            matrix=$(jq -c '.include += [{"image":"aicompanion-gpu-exporter","dockerfile":"services/gpu_exporter/Dockerfile","build-args":""}]' <<<"$matrix")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' <<<"$matrix")" -gt 0 ]; then
            echo 'docker=true' >> "$GITHUB_OUTPUT"
          else
            echo 'docker=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: pytest (voicepipe + services + controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system deps
        # libegl1/libgl1/libxkbcommon0: PySide6 (speech_orb.py, imported by
        # test_speech_orb.py) dlopen()s these at import time even though the
        # tests never open a real window -- QT_QPA_PLATFORM=offscreen below
        # covers the rest of the no-display gap.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0
      - name: Install Python deps
        # requirements/chat.txt covers voicepipe/, tests/, and the
        # services/+controller/ test deps (fastapi test client, kopf,
        # kubernetes client) -- see that file's comments.
        run: pip install -r requirements/chat.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  docker-build:
    # Keep the check name stable; the per-image step below identifies the
    # selected image without relying on expression expansion in a dynamic
    # matrix job name.
    name: build selected image
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # only used to push on `push` to main, see the login step below
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Only pushes on a real merge to main -- PRs still build (catches a
      # broken Dockerfile) but never publish. This is how the home server
      # gets images at all: nothing else builds or hosts them (see
      # deploy/kubernetes/README.md for the pull side, including that GHCR
      # images pushed via GITHUB_TOKEN are private by default).
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          # the services/ Dockerfiles COPY voicepipe/ and services/ paths
          # relative to the repo root, but gpu_scheduler's Dockerfile (and
          # its own header comment) COPY its two files with no path prefix
          # -- it expects its own directory as the build context. Default
          # to root, matrix overrides it for that one image.
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          # Load the gateway image into Docker as well as publishing it so
          # the next step can verify binaries used only at runtime. This
          # caught the gateway image omitting ffmpeg even though its Python
          # tests passed with the audio conversion function mocked.
          load: ${{ matrix.image == 'aicompanion-gateway' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          build-args: ${{ matrix.build-args }}
          # cache so unrelated-service pushes don't rebuild every image cold
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke-test gateway runtime dependencies
        if: matrix.image == 'aicompanion-gateway'
        run: docker run --rm --entrypoint ffmpeg ghcr.io/${{ github.repository_owner }}/aicompanion-gateway:latest -version

  k8s-manifests:
    name: validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kubectl's client-side dry-run still needs *some* kubeconfig context
      # to construct a REST client against, even though it makes no network
      # call -- a throwaway kind cluster sidesteps that and also gets real
      # server-side schema validation (not just YAML shape) for free, using
      # the Docker daemon these runners already have. Pods requesting
      # nvidia.com/gpu will sit Pending forever on a GPU-less kind node,
      # which is fine: `apply` validates and creates the objects, it doesn't
      # wait for them to schedule.
      - name: Create kind cluster
        uses: helm/kind-action@v1
      - name: Apply every manifest
        # namespace.yaml first -- everything else targets `namespace: aicompanion`
        # and apply order otherwise follows the shell glob (alphabetical),
        # which would hit agent.yaml before the namespace exists.
        run: |
          kubectl apply -f deploy/kubernetes/namespace.yaml
          for f in deploy/kubernetes/*.yaml controller/gpu_scheduler/deploy.yaml; do
            [ "$f" = "deploy/kubernetes/namespace.yaml" ] && continue
            echo "== $f =="
            kubectl apply -f "$f"
          done

  firmware:
    name: build m5stick_bridge firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - name: Stub secrets.h (gitignored; example placeholder values are fine for a compile-only check)
        run: cp firmware/m5stick_bridge/include/secrets.h.example firmware/m5stick_bridge/include/secrets.h
      - name: pio run (compile only, no device attached)
        working-directory: firmware/m5stick_bridge
        run: pio run -e m5stick-s3

  android:
    name: build android companion app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships an Android SDK with licenses accepted; AGP
      # fetches the compileSdk platform it needs on first use.
      - name: assembleDebug (compile check; the phone installs its own build)
        working-directory: android_companion
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-companion-debug-apk
          path: android_companion/app/build/outputs/apk/debug/*.apk
          retention-days: 7
