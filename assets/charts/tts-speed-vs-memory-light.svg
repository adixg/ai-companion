<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">TTS engines: time to make 10 s of speech vs memory</title>
<desc id="d">Kitten nano (live): 3.2 s, 330 MiB, CPU; Kitten mini: 7.0 s, 535 MiB, CPU; Kokoro-ONNX int8: 11.5 s, 581 MiB, CPU; Kokoro-ONNX fp32: 4.5 s, 700 MiB, CPU; Chatterbox Nano: 3.9 s, 1857 MiB, GPU; Chatterbox Turbo: 5.7 s, 2805 MiB, GPU</desc>
<rect width="780" height="470" fill="#fcfcfb"/>
<text x="76" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Seconds to make 10 s of speech, by memory used</text>
<circle cx="82.0" cy="54.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="94" y="58" font-size="12.5" fill="#52514e">CPU on the home server (process RAM)</text>
<rect x="379.6" y="48.0" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="397.6" y="58" font-size="12.5" fill="#52514e">GPU, RTX 4060 (VRAM)</text>
<line x1="76" x2="730" y1="398.0" y2="398.0" stroke="#b9b8b2" stroke-width="1"/>
<text x="66" y="402.0" font-size="12" text-anchor="end" fill="#52514e">0 s</text>
<line x1="76" x2="730" y1="323.5" y2="323.5" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="327.5" font-size="12" text-anchor="end" fill="#52514e">3 s</text>
<line x1="76" x2="730" y1="249.0" y2="249.0" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="253.0" font-size="12" text-anchor="end" fill="#52514e">6 s</text>
<line x1="76" x2="730" y1="174.5" y2="174.5" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="178.5" font-size="12" text-anchor="end" fill="#52514e">9 s</text>
<line x1="76" x2="730" y1="100.0" y2="100.0" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="104.0" font-size="12" text-anchor="end" fill="#52514e">12 s</text>
<line x1="76.0" x2="76.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="76.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">0</text>
<line x1="185.0" x2="185.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="185.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">500 MiB</text>
<line x1="294.0" x2="294.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="294.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">1,000 MiB</text>
<line x1="403.0" x2="403.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="403.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">1,500 MiB</text>
<line x1="512.0" x2="512.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="512.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">2,000 MiB</text>
<line x1="621.0" x2="621.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="621.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">2,500 MiB</text>
<line x1="730.0" x2="730.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="730.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">3,000 MiB</text>
<text x="403.0" y="442" font-size="12.5" text-anchor="middle" fill="#52514e">memory the engine holds</text>
<text x="730" y="92" font-size="11.5" text-anchor="end" fill="#52514e">lower is faster, further left is lighter</text>
<circle cx="147.9" cy="317.6" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="151.9" y="339.6" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Kitten nano (live)</text>
<text x="151.9" y="354.6" font-size="11.5" text-anchor="start" fill="#52514e">3.2 s · 330 MiB</text>
<circle cx="192.6" cy="224.3" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="204.6" y="222.3" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Kitten mini</text>
<text x="204.6" y="237.3" font-size="11.5" text-anchor="start" fill="#52514e">7.0 s · 535 MiB</text>
<circle cx="202.7" cy="112.6" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="214.7" y="110.6" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Kokoro-ONNX int8</text>
<text x="214.7" y="125.6" font-size="11.5" text-anchor="start" fill="#52514e">11.5 s · 581 MiB</text>
<circle cx="228.6" cy="285.6" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="240.6" y="283.6" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Kokoro-ONNX fp32</text>
<text x="240.6" y="298.6" font-size="11.5" text-anchor="start" fill="#52514e">4.5 s · 700 MiB</text>
<rect x="474.8" y="294.2" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="480.8" y="274.2" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Chatterbox Nano</text>
<text x="480.8" y="289.2" font-size="11.5" text-anchor="middle" fill="#52514e">3.9 s · 1857 MiB</text>
<rect x="681.5" y="250.1" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="675.5" y="254.1" font-size="12.5" font-weight="600" text-anchor="end" fill="#0b0b0b">Chatterbox Turbo</text>
<text x="675.5" y="269.1" font-size="11.5" text-anchor="end" fill="#52514e">5.7 s · 2805 MiB</text>
</svg>
