<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">TTS engines: time to make 10 s of speech vs memory</title>
<desc id="d">Chatterbox Nano: 3.9 s, 1857 MiB, GPU; Chatterbox Turbo: 5.7 s, 2805 MiB, GPU; Kitten mini: 6.7 s, 539.2 MiB, CPU; Kitten nano 1.6x (live): 3.0 s, 251.0 MiB, CPU; Kokoro-ONNX fp32: 4.7 s, 650.1 MiB, CPU; Kokoro-ONNX int8: 12.5 s, 462.4 MiB, CPU</desc>
<rect width="780" height="470" fill="#fcfcfb"/>
<text x="76" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Seconds to make 10 s of speech, by memory used</text>
<circle cx="82.0" cy="54.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="94" y="58" font-size="12.5" fill="#52514e">CPU on the home server (process RAM)</text>
<rect x="379.6" y="48.0" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="397.6" y="58" font-size="12.5" fill="#52514e">GPU, RTX 4060 (VRAM)</text>
<line x1="76" x2="730" y1="398.0" y2="398.0" stroke="#b9b8b2" stroke-width="1"/>
<text x="66" y="402.0" font-size="12" text-anchor="end" fill="#52514e">0 s</text>
<line x1="76" x2="730" y1="338.4" y2="338.4" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="342.4" font-size="12" text-anchor="end" fill="#52514e">3 s</text>
<line x1="76" x2="730" y1="278.8" y2="278.8" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="282.8" font-size="12" text-anchor="end" fill="#52514e">6 s</text>
<line x1="76" x2="730" y1="219.2" y2="219.2" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="223.2" font-size="12" text-anchor="end" fill="#52514e">9 s</text>
<line x1="76" x2="730" y1="159.6" y2="159.6" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="163.6" font-size="12" text-anchor="end" fill="#52514e">12 s</text>
<line x1="76" x2="730" y1="100.0" y2="100.0" stroke="#e4e3df" stroke-width="1"/>
<text x="66" y="104.0" font-size="12" text-anchor="end" fill="#52514e">15 s</text>
<line x1="76.0" x2="76.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="76.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">0</text>
<line x1="185.0" x2="185.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="185.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">500 MiB</text>
<line x1="294.0" x2="294.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="294.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">1,000 MiB</text>
<line x1="403.0" x2="403.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="403.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">1,500 MiB</text>
<line x1="512.0" x2="512.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="512.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">2,000 MiB</text>
<line x1="621.0" x2="621.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="621.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">2,500 MiB</text>
<line x1="730.0" x2="730.0" y1="398" y2="403" stroke="#b9b8b2"/>
<text x="730.0" y="418" font-size="12" text-anchor="middle" fill="#52514e">3,000 MiB</text>
<text x="403.0" y="442" font-size="12.5" text-anchor="middle" fill="#52514e">memory the engine holds</text>
<text x="730" y="92" font-size="11.5" text-anchor="end" fill="#52514e">lower is faster, further left is lighter</text>
<rect x="474.8" y="313.8" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="480.8" y="293.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Chatterbox Nano</text>
<text x="480.8" y="308.8" font-size="11.5" text-anchor="middle" fill="#52514e">3.9 s · 1857 MiB · n=3</text>
<rect x="681.5" y="278.5" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="675.5" y="282.5" font-size="12.5" font-weight="600" text-anchor="end" fill="#0b0b0b">Chatterbox Turbo</text>
<text x="675.5" y="297.5" font-size="11.5" text-anchor="end" fill="#52514e">5.7 s · 2805 MiB · n=3</text>
<circle cx="193.5" cy="264.6" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="205.5" y="262.6" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Kitten mini</text>
<text x="205.5" y="277.6" font-size="11.5" text-anchor="start" fill="#52514e">6.7 s · 539 MiB · n=50</text>
<circle cx="130.7" cy="338.7" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="134.7" y="360.7" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Kitten nano 1.6x (live)</text>
<text x="134.7" y="375.7" font-size="11.5" text-anchor="start" fill="#52514e">3.0 s · 251 MiB · n=50</text>
<circle cx="217.7" cy="303.9" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="229.7" y="301.9" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Kokoro-ONNX fp32</text>
<text x="229.7" y="316.9" font-size="11.5" text-anchor="start" fill="#52514e">4.7 s · 650 MiB · n=50</text>
<circle cx="176.8" cy="149.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="188.8" y="147.0" font-size="12.5" font-weight="600" text-anchor="start" fill="#0b0b0b">Kokoro-ONNX int8</text>
<text x="188.8" y="162.0" font-size="11.5" text-anchor="start" fill="#52514e">12.5 s · 462 MiB · n=50</text>
</svg>
