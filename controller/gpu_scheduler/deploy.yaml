apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-scheduler
  namespace: aicompanion
---
# Cluster-scoped: Node readiness is a cluster-wide resource, not namespaced.
# "patch" is here for kopf's own bookkeeping, not the controller's own logic:
# kopf writes a last-handled-configuration annotation back onto every
# resource it watches after each handler run, to track what it's already
# processed. Without it, on_node_condition_change never even reaches
# _set_agent_ollama_host -- confirmed live (2026-09-16): every node event
# looped on `nodes "..." is forbidden ... cannot patch` until this was
# added, and the agent Deployment's OLLAMA_HOST never budged.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-scheduler-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-scheduler-nodes
subjects:
  - kind: ServiceAccount
    name: gpu-scheduler
    namespace: aicompanion
roleRef:
  kind: ClusterRole
  name: gpu-scheduler-nodes
  apiGroup: rbac.authorization.k8s.io
---
# Namespaced: only needs to patch the one Deployment it routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-scheduler-agent-deployment
  namespace: aicompanion
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["agent"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-scheduler-agent-deployment
  namespace: aicompanion
subjects:
  - kind: ServiceAccount
    name: gpu-scheduler
    namespace: aicompanion
roleRef:
  kind: Role
  name: gpu-scheduler-agent-deployment
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-scheduler
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-scheduler
  template:
    metadata:
      labels:
        app: gpu-scheduler
    spec:
      serviceAccountName: gpu-scheduler
      containers:
        - name: gpu-scheduler
          image: ghcr.io/adixg/aicompanion-gpu-scheduler:latest
