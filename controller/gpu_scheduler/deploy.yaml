apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-scheduler
  namespace: aigf
---
# Cluster-scoped: Node readiness is a cluster-wide resource, not namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-scheduler-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-scheduler-nodes
subjects:
  - kind: ServiceAccount
    name: gpu-scheduler
    namespace: aigf
roleRef:
  kind: ClusterRole
  name: gpu-scheduler-nodes
  apiGroup: rbac.authorization.k8s.io
---
# Namespaced: only needs to patch the one Deployment it routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-scheduler-agent-deployment
  namespace: aigf
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["agent"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-scheduler-agent-deployment
  namespace: aigf
subjects:
  - kind: ServiceAccount
    name: gpu-scheduler
    namespace: aigf
roleRef:
  kind: Role
  name: gpu-scheduler-agent-deployment
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-scheduler
  namespace: aigf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-scheduler
  template:
    metadata:
      labels:
        app: gpu-scheduler
    spec:
      serviceAccountName: gpu-scheduler
      containers:
        - name: gpu-scheduler
          image: aigf-gpu-scheduler:latest
