apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-scheduler
  namespace: aicompanion
---
# Cluster-scoped: Node readiness is a cluster-wide resource, not namespaced.
# "patch" is here for kopf's own bookkeeping, not the controller's own logic:
# kopf writes a last-handled-configuration annotation back onto every
# resource it watches after each handler run, to track what it's already
# processed. Without it, on_node_condition_change never even reaches
# _set_agent_target -- confirmed live (2026-09-16): every node event
# looped on `nodes "..." is forbidden ... cannot patch` until this was
# added, and the agent Deployment's LLM_HOST (then OLLAMA_HOST) never budged.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-scheduler-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # kopf also posts a Kubernetes Event recording each handler run, for its
  # own diagnostics -- and since Node is cluster-scoped (no namespace of its
  # own), kopf targets the "default" namespace for these specifically.
  # Confirmed live (2026-09-16): without this, every single handler run logs
  # 9 escalating 403 retries ("events is forbidden ... in the namespace
  # default") before giving up and continuing anyway -- the actual
  # patch/failover logic isn't blocked by it, but it's real log noise and
  # wasted retry latency on every node transition.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-scheduler-nodes
subjects:
  - kind: ServiceAccount
    name: gpu-scheduler
    namespace: aicompanion
roleRef:
  kind: ClusterRole
  name: gpu-scheduler-nodes
  apiGroup: rbac.authorization.k8s.io
---
# Namespaced: only needs to patch the one Deployment it routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-scheduler-agent-deployment
  namespace: aicompanion
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["agent"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-scheduler-agent-deployment
  namespace: aicompanion
subjects:
  - kind: ServiceAccount
    name: gpu-scheduler
    namespace: aicompanion
roleRef:
  kind: Role
  name: gpu-scheduler-agent-deployment
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-scheduler
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-scheduler
  template:
    metadata:
      labels:
        app: gpu-scheduler
    spec:
      # Same reasoning as agent.yaml's nodeSelector: confirmed live
      # (2026-09-16) that leaving this unset lets the scheduler place the
      # controller itself on the rtx4060 node -- when that node then goes
      # down, the controller that's supposed to react to it dies at the
      # same moment, and agent never gets failed back to llama-cpp-gtx1650.
      nodeSelector:
        gpu-tier: gtx1650
      priorityClassName: voice-critical
      serviceAccountName: gpu-scheduler
      containers:
        - name: gpu-scheduler
          image: ghcr.io/adixg/aicompanion-gpu-scheduler:latest
          # Measured ~73Mi (2026-09-23).
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 256Mi}
