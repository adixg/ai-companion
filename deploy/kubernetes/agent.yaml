# Points at llama-cpp-gtx1650 by default (the always-up node); this is the
# Deployment controller/gpu_scheduler/ patches LLM_HOST/LLM_MODEL on (the
# template patch itself triggers the rollout) while the rtx4060 node is Ready
# and llama-cpp-rtx4060 is Available, per that directory's README.
# CPU-only container -- see services/agent/Dockerfile's comment for why.
#
# nodeSelector pins the pod itself to the always-up node too, same as
# stt/tts -- confirmed live (2026-09-16) that this was a real gap, not just
# belt-and-suspenders: with no selector, the scheduler placed agent's pod on
# the rtx4060 node, so stopping that laptop's k3s-agent killed agent's own
# pod at the exact moment the controller needed to fail it back over.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      nodeSelector:
        gpu-tier: gtx1650
      priorityClassName: voice-critical
      containers:
        - name: agent
          image: ghcr.io/adixg/aicompanion-agent:latest
          args: ["--llm-backend", "openai-compatible"]
          # Measured ~57Mi (2026-09-23).
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 256Mi}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: tempo:4317
            - name: LLM_HOST
              value: "http://llama-cpp-gtx1650:8080/v1"
            # Each llama-server instance has the model sized for its own
            # card pulled -- controller/gpu_scheduler/ patches this
            # alongside LLM_HOST on a node switch (see its README).
            - name: LLM_MODEL
              value: "qwen3.5-4b"
            - name: MCP_SERVER_COMMAND
              value: "python /app/tools/companion_control_mcp.py"
            - name: COMPANION_CONTROL_PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: COMPANION_CONTROL_AGENT_URL
              value: "http://agent:8002"
            - name: COMPANION_CONTROL_SEARXNG_URL
              value: "http://searxng:8080"
            # The Stick's volume/brightness tools call the gateway's
            # /device/settings with the same token as the gateway (gateway.yaml).
            - name: COMPANION_CONTROL_GATEWAY_URL
              value: "http://gateway:8000"
            - name: COMPANION_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: device-control, key: token, optional: true}
            # The notes tools (read_notes/add_note/write_notes) touch only
            # this one file, which the owner also edits on arch-ssd.
            - name: COMPANION_CONTROL_NOTES_FILE
              value: /rina/notes.md
            # ask_claude: questions the local model hands to Claude. Off
            # without the Secret; create it without the key touching shell
            # history (docs/companion-control-mcp.md):
            #   read -rs KEY && kubectl -n aicompanion create secret generic \
            #     anthropic-api --from-literal=api-key="$KEY"; unset KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: anthropic-api, key: api-key, optional: true}
            - name: COMPANION_CONTROL_CLAUDE_MODEL
              value: claude-sonnet-5
            - name: COMPANION_CONTROL_CLAUDE_DAILY_LIMIT
              value: "100"
          ports:
            - {containerPort: 8002, name: metrics}
          readinessProbe:
            httpGet: {path: /health, port: 8002}
            initialDelaySeconds: 5
          volumeMounts:
            - {name: notes, mountPath: /rina}
      volumes:
        # The directory, not the file: editors save by renaming a new file
        # over the old one, and a single-file mount would keep the old inode.
        # Nothing else of the home directory is mounted.
        - name: notes
          hostPath:
            path: /home/aditya/rina
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: aicompanion
spec:
  selector:
    app: agent
  ports:
    - name: metrics
      port: 8002
      targetPort: 8002
