# Points at ollama-gtx1650 by default (the always-up node); this is the
# Deployment controller/gpu_scheduler/ patches OLLAMA_HOST on and rolls
# restart when the rtx4060 node becomes Ready, per that directory's README.
# CPU-only container -- see services/agent/Dockerfile's comment for why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/adixg/aicompanion-agent:latest
          args: ["--llm-backend", "ollama", "--model", "qwen3.5:4b"]
          env:
            - name: OLLAMA_HOST
              value: "http://ollama-gtx1650:11434"
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet: {path: /health, port: 8002}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: aicompanion
spec:
  selector:
    app: agent
  ports:
    - port: 8002
      targetPort: 8002
