# Phase 1 skeleton (see services/gateway/app.py's docstring) -- not yet the
# firmware's actual wire protocol. NodePort so the M5StickS3 can reach it
# directly once Phase 2 ports bridge_server.py's real protocol over; for now
# this is for integration testing the stt->agent->tts chain, not the Stick.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        gpu-tier: gtx1650  # always-on node: the Stick needs a stable address to connect to
      containers:
        - name: gateway
          image: ghcr.io/adixg/aicompanion-gateway:latest
          args:
            - "--stt-url=http://stt:8001"
            - "--agent-url=http://agent:8002"
            - "--tts-url=http://tts:8003"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aicompanion
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
