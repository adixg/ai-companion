# Primary M5StickS3 ingress. The Android relay reaches this WebSocket through
# the home server's stable Tailscale name and NodePort 30800. The standalone
# bridge_server.py remains a development/fallback path on port 8765.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        gpu-tier: gtx1650  # always-on node: the Stick needs a stable address to connect to
      priorityClassName: voice-critical
      containers:
        - name: gateway
          image: ghcr.io/adixg/aicompanion-gateway:latest
          # Measured ~50Mi idle (2026-09-23); the limit allows for the speaker
          # gate's ONNX model and ffmpeg resampling bursts.
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 384Mi}
          args:
            - "--stt-url=http://stt:8001"
            - "--agent-url=http://agent:8002"
            - "--tts-url=http://tts:8003"
          env: [{name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}]
          ports:
            - {containerPort: 8000, name: metrics}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          volumeMounts:
            # Created from the gitignored voiceprint plus the tracked profile;
            # see deploy/kubernetes/README.md. Without these, the gateway would
            # silently run without owner voice verification/personalisation.
            - name: personal-data
              mountPath: /app/memory
              readOnly: true
      volumes:
        - name: personal-data
          secret:
            secretName: aicompanion-personal-data
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aicompanion
spec:
  # Deliberately fixed: this is the Android app's default port and therefore
  # part of the device-facing interface, not an incidental cluster detail.
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
      nodePort: 30800
