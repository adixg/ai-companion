# Primary M5StickS3 ingress. The Android relay reaches this WebSocket through
# the home server's stable Tailscale name and NodePort 30800. The standalone
# bridge_server.py remains a development/fallback path on port 8765.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        gpu-tier: gtx1650  # always-on node: the Stick needs a stable address to connect to
      priorityClassName: voice-critical
      containers:
        - name: gateway
          image: ghcr.io/adixg/aicompanion-gateway:latest
          # Measured ~50Mi idle (2026-09-23); the limit allows for the speaker
          # gate's ONNX model and ffmpeg resampling bursts.
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 384Mi}
          args:
            - "--stt-url=http://stt:8001"
            - "--agent-url=http://agent:8002"
            - "--tts-url=http://tts:8003"
            # 0.6 rejected the owner (0.536 on 2026-09-24; through the Stick they
            # score 0.54-0.66). Strangers score 0.07-0.28, so 0.5 keeps a wide gap.
            - "--speaker-threshold=0.5"
            # Owner's choice (2026-09-25): no voice check, every utterance is
            # answered. The threshold/short-utterance settings stay for when it's
            # turned back on (delete this line). Note the agent's Stick volume and
            # brightness tools are then usable by any voice near the Stick.
            - "--no-speaker-check"
            # Clips under 2s can't be verified (measured 2026-09-24: cut to 1.5s,
            # 6 of 23 owner clips score under 0.5), so this answers them unchecked:
            # quick phrases work, and anyone can get a short reply. Switch to
            # "ask" once tools that act (not just read) are added.
            - "--short-utterances=allow"
            # Keep the newest 50 utterances (any verdict) on the node so real Stick
            # audio can be added to the voiceprint: tools/voiceprint_add.py. It is
            # biometric data, kept local, bounded and pruned; delete this line and
            # the volume below to stop keeping it.
            - "--keep-utterances=/utterances"
            # Every turn the Stick sent (wake word or button): its recording,
            # what STT heard, the reply, tool calls, timings, errors, as one
            # JSON line per turn in /var/lib/aicompanion/conversations/ on the
            # node. Recordings past 2 GB are pruned oldest first; transcripts
            # stay. Delete these lines and the volume below to stop.
            - "--conversation-log=/conversations"
            - "--conversation-log-max-gb=2"
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}
            # Bearer token for /device/settings (the agent's volume/brightness
            # tools). Without the Secret the control API is simply disabled.
            #   kubectl -n aicompanion create secret generic device-control \
            #     --from-literal=token="$(openssl rand -hex 24)"
            - name: GATEWAY_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: device-control, key: token, optional: true}
          ports:
            - {containerPort: 8000, name: metrics}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          volumeMounts:
            # Created from the gitignored voiceprint plus the tracked profile;
            # see deploy/kubernetes/README.md. Without these, the gateway would
            # silently run without owner voice verification/personalisation.
            - name: personal-data
              mountPath: /app/memory
              readOnly: true
            - {name: utterances, mountPath: /utterances}
            - {name: conversations, mountPath: /conversations}
      volumes:
        - name: conversations
          hostPath:
            path: /var/lib/aicompanion/conversations
            type: DirectoryOrCreate
        - name: utterances
          hostPath:
            path: /var/lib/aicompanion/utterances
            type: DirectoryOrCreate
        - name: personal-data
          secret:
            secretName: aicompanion-personal-data
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aicompanion
spec:
  # Deliberately fixed: this is the Android app's default port and therefore
  # part of the device-facing interface, not an incidental cluster detail.
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
      nodePort: 30800
