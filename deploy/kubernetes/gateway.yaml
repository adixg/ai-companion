# services/gateway/app.py now has full wire-protocol parity with
# bridge_server.py (2026-09-16) -- see its own docstring. NodePort so the
# M5StickS3 can reach it directly, though bridge_server.py is still what's
# actually flashed against; this just gets the manifest itself applied and
# reachable ahead of the real cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        gpu-tier: gtx1650  # always-on node: the Stick needs a stable address to connect to
      containers:
        - name: gateway
          image: ghcr.io/adixg/aicompanion-gateway:latest
          args:
            - "--stt-url=http://stt:8001"
            - "--agent-url=http://agent:8002"
            - "--tts-url=http://tts:8003"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aicompanion
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
