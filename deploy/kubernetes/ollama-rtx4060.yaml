# Ollama on the laptop's RTX 4060 -- only Ready when the laptop is up and
# joined to the cluster; k3s simply won't schedule this pod otherwise. This
# is the node with headroom for a real model (Chatterbox Nano + an 8B LLM
# both fit in the measured 8188 MiB budget, see docs/hardware-budget.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-rtx4060
  namespace: aicompanion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-rtx4060
  template:
    metadata:
      labels:
        app: ollama-rtx4060
    spec:
      nodeSelector:
        gpu-tier: rtx4060
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          hostPath:
            path: /var/lib/aicompanion/ollama-rtx4060
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-rtx4060
  namespace: aicompanion
spec:
  selector:
    app: ollama-rtx4060
  ports:
    - port: 11434
      targetPort: 11434
