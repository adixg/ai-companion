# Ollama on the laptop's RTX 4060 -- only Ready when the laptop is up and
# joined to the cluster; k3s simply won't schedule this pod otherwise. This
# is the node with headroom for a real model (Chatterbox Nano + an 8B LLM
# both fit in the measured 8188 MiB budget, see docs/hardware-budget.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-rtx4060
  namespace: aicompanion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-rtx4060
  template:
    metadata:
      labels:
        app: ollama-rtx4060
    spec:
      nodeSelector:
        gpu-tier: rtx4060
      runtimeClassName: nvidia
      # This node's own resolv.conf carries extra search domains from its
      # host OS/VPN config, which k8s merges into every pod here. With the
      # default ndots:5, a 2-dot external name like registry.ollama.ai tries
      # every search-suffixed variant (several hitting slow/nonexistent
      # resolvers) before the bare name -- confirmed live (2026-09-16) this
      # was enough to time out `ollama pull`, on the one pod here that
      # actually needs to reach the public internet. ndots:1 skips that.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        # Bind-mounts this node's own native Ollama's model store directly,
        # read-write -- NOT a copy. This node's own OS already runs a plain
        # `ollama serve` on :11434 (see docs/hardware-budget.md) with models
        # already pulled there; the pod reuses that same data in place.
        # A prior version of this file copied the whole store into a
        # separate hostPath instead, which duplicated ~20GB and crashed the
        # laptop when a `sudo rsync` filled the disk mid-copy (2026-09-16,
        # see docs/deployment-architecture.md) -- sharing avoids that whole
        # class of problem rather than needing a bigger disk.
        - name: models
          hostPath:
            path: /usr/share/ollama/.ollama
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-rtx4060
  namespace: aicompanion
spec:
  selector:
    app: ollama-rtx4060
  ports:
    - port: 11434
      targetPort: 11434
