apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt
  namespace: aicompanion
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU-constrained node (time-sliced, not partitioned): a
                     # RollingUpdate briefly wants old+new pods live at once,
                     # which deadlocks here since llama-cpp-gtx1650 already holds
                     # one of the two time-sliced nvidia.com/gpu slots, same
                     # reasoning as the ollama-*.yaml Deployments
  selector:
    matchLabels:
      app: stt
  template:
    metadata:
      labels:
        app: stt
    spec:
      nodeSelector:
        gpu-tier: gtx1650  # always-on node: STT must be reachable regardless of the 4060
      runtimeClassName: nvidia
      priorityClassName: voice-critical
      containers:
        - name: stt
          image: ghcr.io/adixg/aicompanion-stt:latest
          args: ["--stt-backend", "faster-whisper", "--whisper-model", "small", "--whisper-device", "cuda"]
          env: [{name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}]
          ports:
            - {containerPort: 8001, name: metrics}
          # Memory measured ~500-575Mi (2026-09-23). The request is close to real
          # use so the OOM killer treats this as well-behaved and picks pods
          # running far over their request first.
          resources:
            requests: {memory: 512Mi}
            limits:
              memory: 1Gi
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stt
  namespace: aicompanion
spec:
  selector:
    app: stt
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
