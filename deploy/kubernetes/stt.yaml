apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt
  namespace: aicompanion
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU-constrained node (time-sliced, not partitioned): a
                     # RollingUpdate briefly wants old+new pods live at once,
                     # which deadlocks here since llama-cpp-gtx1650 already holds
                     # one of the two time-sliced nvidia.com/gpu slots, same
                     # reasoning as the ollama-*.yaml Deployments
  selector:
    matchLabels:
      app: stt
  template:
    metadata:
      labels:
        app: stt
    spec:
      nodeSelector:
        gpu-tier: gtx1650  # always-on node: STT must be reachable regardless of the 4060
      runtimeClassName: nvidia
      priorityClassName: voice-critical
      containers:
        - name: stt
          image: ghcr.io/adixg/aicompanion-stt:latest
          # Moonshine base on CPU: 0.18 s p50 on arch-ssd vs whisper-on-1650's
          # 3.31 s (docs/hardware-budget.md, "sherpa-onnx backends"). English only.
          # Switch backend with tools/switch-backend.sh (stt: moonshine, parakeet,
          # whisper); it patches these args and the memory limit together.
          args: ["--stt-backend", "moonshine"]
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}
            - {name: SHERPA_MODELS_DIR, value: /models/sherpa-onnx}
          ports:
            - {containerPort: 8001, name: metrics}
          volumeMounts:
            - {name: sherpa-models, mountPath: /models/sherpa-onnx}
          # Memory: moonshine peaked at 571Mi (2026-09-24); whisper measured
          # ~500-575Mi (2026-09-23) but its peak touched 1023Mi. The request is
          # close to real use so the OOM killer picks pods running far over
          # their request first. The GPU slot is kept so switching back to
          # whisper on cuda needs no manifest change; moonshine doesn't use it.
          resources:
            requests: {memory: 512Mi}
            limits:
              memory: 1Gi
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 10
      volumes:
        # parakeet/moonshine models (voicepipe/backends/_sherpa.py) download
        # here on first use; shared with the tts pod, same node.
        - name: sherpa-models
          hostPath:
            path: /var/lib/aicompanion/sherpa-onnx
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: stt
  namespace: aicompanion
spec:
  selector:
    app: stt
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
