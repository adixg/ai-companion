# Kokoro-82M: small, local female voice backend. It runs on CPU so the
# always-on 1650 remains available to Whisper and the selected LLM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  namespace: aicompanion
spec:
  replicas: 1
  strategy:
    type: Recreate  # arch-ssd has 8GB for the whole stack; a rolling update would
                    # briefly hold two ~1GB copies of this pod at once
  selector:
    matchLabels:
      app: tts
  template:
    metadata:
      labels:
        app: tts
    spec:
      nodeSelector:
        gpu-tier: gtx1650
      priorityClassName: voice-critical
      containers:
        - name: tts
          image: ghcr.io/adixg/aicompanion-tts-kokoro:latest
          imagePullPolicy: Always
          # Measured 2026-09-23 via process_resident_memory_bytes: 1.6Gi right
          # after start, 2.2Gi after one reply-sized synth, 2.8Gi after a ~1000
          # character one, and it does not shrink afterwards. A first cut of
          # 1792Mi, sized from an idle reading, OOM-killed it mid-reply, so the
          # limit has to cover peak synthesis, not idle. Largest pod on the node.
          resources:
            requests: {memory: 1536Mi}
            limits: {memory: 3Gi}
          args: ["--tts-backend", "kokoro", "--kokoro-voice", "af_bella", "--kokoro-language", "a", "--kokoro-device", "cpu"]
          # Switch backend with tools/switch-backend.sh (tts: kokoro,
          # kokoro-onnx, kitten); it patches these args and the memory limit
          # together, since kokoro-onnx and kitten need a fraction of this one.
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}
            - {name: SHERPA_MODELS_DIR, value: /models/sherpa-onnx}
          ports:
            - {containerPort: 8003, name: metrics}
          volumeMounts:
            - {name: sherpa-models, mountPath: /models/sherpa-onnx}
          readinessProbe:
            httpGet: {path: /health, port: 8003}
            initialDelaySeconds: 10
      volumes:
        # kokoro-onnx/kitten models (voicepipe/backends/_sherpa.py) download
        # here on first use; shared with the stt pod, same node.
        - name: sherpa-models
          hostPath:
            path: /var/lib/aicompanion/sherpa-onnx
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: tts
  namespace: aicompanion
spec:
  selector:
    app: tts
  ports:
    - name: metrics
      port: 8003
      targetPort: 8003
