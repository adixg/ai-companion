# KittenTTS nano (voice Bella) on CPU via sherpa-onnx, the lightest and
# fastest TTS measured on arch-ssd (docs/hardware-budget.md, "sherpa-onnx
# backends"). The image also has kokoro-onnx and PyTorch Kokoro; switch with
# tools/switch-backend.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  namespace: aicompanion
spec:
  replicas: 1
  strategy:
    type: Recreate  # arch-ssd has 8GB for the whole stack; a rolling update would
                    # briefly hold two ~1GB copies of this pod at once
  selector:
    matchLabels:
      app: tts
  template:
    metadata:
      labels:
        app: tts
    spec:
      nodeSelector:
        gpu-tier: gtx1650
      priorityClassName: voice-critical
      containers:
        - name: tts
          image: ghcr.io/adixg/aicompanion-tts-kokoro:latest
          imagePullPolicy: Always
          # kitten peaked at 559Mi in the service (cgroup memory.peak, a
          # 150 s reply included, 2026-09-24). PyTorch Kokoro, the previous
          # default, needed a 3Gi limit and was still OOM-killed. The limit
          # is Kokoro-sized (~1.35 GiB settled) because the agent's set_voice
          # can switch this pod to Kokoro at runtime (services/tts/voices.py);
          # the request stays kitten-sized.
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 2Gi}
          # Speed 1.6, the owner's pick after hearing 1.0-1.5: at 1.0 Kitten
          # speaks noticeably slower than Kokoro (a demo line: 11.7 s at 1.0,
          # 9.2 s at 1.3, 8.3 s at 1.5).
          # --voice-state: the voice picked with set_voice ("switch to Kokoro
          # Bella") survives a restart and wins over these args; delete
          # /var/lib/aicompanion/tts/voice.json to go back to them.
          args: ["--tts-backend", "kitten", "--kitten-voice", "Bella", "--kitten-speed", "1.6", "--voice-state", "/tts-state/voice.json"]
          # Switch backend with tools/switch-backend.sh (tts: kitten,
          # kokoro-onnx, kokoro); it patches these args and the memory limit
          # together, since they need 768Mi, 2Gi and 3Gi+ respectively. For
          # kitten <-> kokoro-onnx voices, set_voice does it without a restart.
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}
            - {name: SHERPA_MODELS_DIR, value: /models/sherpa-onnx}
          ports:
            - {containerPort: 8003, name: metrics}
          volumeMounts:
            - {name: sherpa-models, mountPath: /models/sherpa-onnx}
            - {name: tts-state, mountPath: /tts-state}
          readinessProbe:
            httpGet: {path: /health, port: 8003}
            initialDelaySeconds: 10
      volumes:
        - name: tts-state
          hostPath:
            path: /var/lib/aicompanion/tts
            type: DirectoryOrCreate
        # kokoro-onnx/kitten models (voicepipe/backends/_sherpa.py) download
        # here on first use; shared with the stt pod, same node.
        - name: sherpa-models
          hostPath:
            path: /var/lib/aicompanion/sherpa-onnx
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: tts
  namespace: aicompanion
spec:
  selector:
    app: tts
  ports:
    - name: metrics
      port: 8003
      targetPort: 8003
