# vits, not chatterbox: the only TTS backend that's free on VRAM (see
# docs/hardware-budget.md), which matters because this pod is pinned to the
# always-on 1650 alongside stt and (one of) the ollama pods, and it can't
# clone a voice -- Chatterbox on the 4060 for when that node is up is
# future work, not wired in yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts
  template:
    metadata:
      labels:
        app: tts
    spec:
      nodeSelector:
        gpu-tier: gtx1650
      containers:
        - name: tts
          image: ghcr.io/adixg/aicompanion-tts-vits:latest
          imagePullPolicy: Always
          args: ["--tts-backend", "elevenlabs"]
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}
            - {name: ELEVENLABS_VOICE_ID, value: "aalCGJcUMZVTTt7aH2BX"}
            - {name: ELEVENLABS_MODEL_ID, value: "eleven_flash_v2_5"}
            - {name: ELEVENLABS_CREDITS_REMAINING, value: "8764"}
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef: {name: elevenlabs, key: ELEVENLABS_API_KEY}
          ports:
            - {containerPort: 8003, name: metrics}
          readinessProbe:
            httpGet: {path: /health, port: 8003}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tts
  namespace: aicompanion
spec:
  selector:
    app: tts
  ports:
    - name: metrics
      port: 8003
      targetPort: 8003
