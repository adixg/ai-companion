# vits, not chatterbox: the only TTS backend that's free on VRAM (see
# docs/hardware-budget.md), which matters because this pod is pinned to the
# always-on 1650 alongside stt and (one of) the ollama pods, and it can't
# clone a voice -- Chatterbox on the 4060 for when that node is up is
# future work, not wired in yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  namespace: aigf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts
  template:
    metadata:
      labels:
        app: tts
    spec:
      nodeSelector:
        gpu-tier: gtx1650
      containers:
        - name: tts
          image: aigf-tts-vits:latest
          args: ["--tts-backend", "vits"]
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet: {path: /health, port: 8003}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tts
  namespace: aigf
spec:
  selector:
    app: tts
  ports:
    - port: 8003
      targetPort: 8003
