# Kokoro-82M: small, local female voice backend. It runs on CPU so the
# always-on 1650 remains available to Whisper and the selected LLM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  namespace: aicompanion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts
  template:
    metadata:
      labels:
        app: tts
    spec:
      nodeSelector:
        gpu-tier: gtx1650
      containers:
        - name: tts
          image: ghcr.io/adixg/aicompanion-tts-kokoro:latest
          imagePullPolicy: Always
          args: ["--tts-backend", "kokoro", "--kokoro-voice", "af_bella", "--kokoro-language", "a", "--kokoro-device", "cpu"]
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: tempo:4317}
          ports:
            - {containerPort: 8003, name: metrics}
          readinessProbe:
            httpGet: {path: /health, port: 8003}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tts
  namespace: aicompanion
spec:
  selector:
    app: tts
  ports:
    - name: metrics
      port: 8003
      targetPort: 8003
