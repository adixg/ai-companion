; Streams the StickS3's IMU over USB serial at 50 Hz, for fitting the
; raise-to-talk detector (firmware/m5stick_bridge/src/raise_gesture.h) to
; real motion: tools/imu_record.py drives a recording session. Same board and
; partition table as m5stick_bridge, so its NVS (bond, settings) survives;
; flash m5stick_bridge back afterwards.
[env:m5stick-s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
monitor_speed = 115200
upload_speed = 1500000
lib_deps = m5stack/M5Unified @ ^0.2.2
