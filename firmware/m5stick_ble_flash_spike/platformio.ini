; BLE spike (see /home/aditya/.claude/plans/tranquil-drifting-stream.md).
; Board/build_flags copied exactly from firmware/m5stick_bridge/platformio.ini.
; Phase 1 (flash budget) is done -- see CLAUDE.md for the five lib_deps
; configurations measured. Now on Phase 2 (throughput): NimBLE + M5Unified,
; matching Phase 1's "config B".
[env:m5stick-s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -mfix-esp32-psram-cache-issue
    ; Reproduced ATT error 0x11 (BLE_ATT_ERR_INSUFFICIENT_RES) twice on the
    ; CCCD write, right as several GATT ops (connect/PHY/517-MTU/discover/
    ; subscribe) pile up within ~1s of each other. Read NimBLE-Arduino's own
    ; source (nimconfig.h + ble_gatts.c) to find the real cause rather than
    ; guessing: the CCCD-write handler itself (ble_gatts_clt_cfg_access_locked)
    ; only returns 0x11 on a *read*, and only persists to the CCCD store for
    ; *bonded* connections (this spike never bonds) -- so it's not a CCCD- or
    ; store-capacity problem. The remaining 0x11 sites are all in the ATT
    ; server's mbuf/buffer allocation path (ble_att_svr.c), i.e. the msys_1
    ; pool -- nimconfig.h's own comment: "may need to be increased if you are
    ; sending large blocks of data" -- a 517-byte MTU makes every full-size ATT
    ; PDU span multiple of msys_1's default 12 * 256-byte blocks, and several
    ; such PDUs land back-to-back right after connect. Doubled as a cheap,
    ; RAM-only fix (this board has PSRAM headroom to spare).
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.1
    m5stack/M5Unified @ ^0.2.2
