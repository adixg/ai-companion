; M5StickS3 <-> bridge_server.py voice bridge.
; ESP32-S3-PICO-1-N8R8: 8MB flash (QIO), 8MB PSRAM (Octal/OPI), ES8311 audio codec.
; No dedicated PlatformIO board id yet for the StickS3, so this borrows
; freenove_esp32_s3_wroom, which targets the same N8R8 flash/PSRAM combo and
; even shares the exact same USB hwid (303A:1001) — the generic
; esp32-s3-devkitc-1 entry with manually-guessed flash_mode/psram_type flags
; left the bootloader image header wrong and PSRAM failed to init at boot
; ("PSRAM ID read error"); board_build.arduino.memory_type=qio_opi is the
; combined key the Arduino core actually needs to get that header right.
[env:m5stick-s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

board_build.arduino.memory_type = qio_opi
; Two 3.2 MB app slots (plus the same nvs/otadata offsets huge_app.csv had,
; so bonds and settings survive the switch) for firmware updates over BLE:
; see src/ota_update.h. The first flash with this table has to be over USB.
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -mfix-esp32-psram-cache-issue
    ; The TFLite Micro runtime in lib/tflm_esp is built with these; code that
    ; includes its headers (src/wake_word.h) must match, or TfLiteTensor's
    ; layout differs between the two and every tensor read returns garbage.
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    ; Reported to the phone app (stick_settings.h), so it can show which build
    ; is running and confirm an update landed.
    !echo "-DFW_VERSION=\\\"$(git describe --always --dirty 2>/dev/null || echo unknown)\\\""

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    ; Phase 4 of the BLE migration (2026-09-16): replaces
    ; links2004/WebSockets now that the Stick reaches bridge_server.py over
    ; BLE + the phone's Android app (RelayService.kt) instead of Wi-Fi.
    ; Same version already proven in firmware/m5stick_ble_flash_spike/ across
    ; Phases 1-3 -- see docs/ble-migration.md.
    h2zero/NimBLE-Arduino @ ^2.5.1
