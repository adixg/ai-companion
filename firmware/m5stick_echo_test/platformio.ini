; Pure-hardware mic/speaker sanity check for the M5StickS3 — no Wi-Fi, no
; server, nothing but the on-board mic, codec, and speaker. See
; firmware/m5stick_bridge/platformio.ini for notes on why this board config
; (freenove_esp32_s3_wroom + qio_opi) instead of the generic devkit one.
[env:m5stick-s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -mfix-esp32-psram-cache-issue

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified @ ^0.2.2
