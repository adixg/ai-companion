; Minimal M5StickS3 connectivity test: join a Wi-Fi hotspot, GET the gateway
; on port 8000. Same board config as firmware/m5stick_bridge/ (see that
; project's platformio.ini for why freenove_esp32_s3_wroom + qio_opi).
[env:m5stick-s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -mfix-esp32-psram-cache-issue

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

lib_deps =
    m5stack/M5Unified @ ^0.2.2
