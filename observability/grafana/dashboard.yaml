apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-aicompanion, namespace: aicompanion}
data:
  aicompanion.json: |
    {"annotations":{"list":[]},"editable":true,"panels":[{"type":"timeseries","title":"HTTP request rate","targets":[{"expr":"sum by (service) (rate(aicompanion_http_requests_total[5m]))","legendFormat":"{{service}}"}]},{"type":"timeseries","title":"HTTP p95 latency","targets":[{"expr":"histogram_quantile(0.95, sum by (le, service) (rate(aicompanion_http_request_duration_seconds_bucket[5m])))","legendFormat":"{{service}}"}]},{"type":"timeseries","title":"Gateway p95 turn latency","targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(aicompanion_gateway_turn_duration_seconds_bucket[5m])))","legendFormat":"p95"}]},{"type":"timeseries","title":"Gateway stage p95 latency","targets":[{"expr":"histogram_quantile(0.95, sum by (le, stage) (rate(aicompanion_gateway_stage_duration_seconds_bucket[5m])))","legendFormat":"{{stage}}"}]}],"schemaVersion":41,"title":"AI Companion","version":1}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-provider, namespace: aicompanion}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: aicompanion
        folder: AI Companion
        type: file
        options: {path: /var/lib/grafana/dashboards}
