apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-aicompanion, namespace: aicompanion}
data:
  aicompanion.json: |
    {
      "uid": "aicompanion",
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "description": "Number of services Prometheus can scrape. Four is healthy.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 3}, {"color": "green", "value": 4}]}, "unit": "none"}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name"},
          "targets": [{"expr": "sum(up{service=~\"gateway|stt|agent|tts\"})", "legendFormat": "services up", "refId": "A"}],
          "title": "Service targets up",
          "type": "stat"
        },
        {
          "description": "Prometheus scrape reachability for each application service.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "none"}, "overrides": []},
          "gridPos": {"h": 5, "w": 18, "x": 6, "y": 0},
          "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "wideLayout": true},
          "targets": [{"expr": "up{service=~\"gateway|stt|agent|tts\"}", "legendFormat": "{{service}}", "refId": "A"}],
          "title": "Per-service scrape health",
          "type": "stat"
        },
        {
          "description": "Completed HTTP requests per second, averaged across the last five minutes.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (service) (rate(aicompanion_http_requests_total[5m]))", "legendFormat": "{{service}}", "refId": "A"}],
          "title": "HTTP request rate",
          "type": "timeseries"
        },
        {
          "description": "Share of completed HTTP requests returning a 5xx status. Alert if sustained above 5%.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "id": 4,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "(100 * sum by (service) (rate(aicompanion_http_requests_total{status=~\"5..\"}[5m])) / sum by (service) (rate(aicompanion_http_requests_total[5m]))) or (sum by (service) (rate(aicompanion_http_requests_total[5m])) * 0)", "legendFormat": "{{service}}", "refId": "A"}],
          "title": "HTTP 5xx error rate",
          "type": "timeseries"
        },
        {
          "description": "p95 HTTP duration by service. Includes the agent request that waits for the LLM response.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "min": 0, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "id": 5,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, service) (rate(aicompanion_http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{service}}", "refId": "A"}],
          "title": "HTTP p95 latency",
          "type": "timeseries"
        },
        {
          "description": "End-to-end time for a completed gateway voice turn, from received utterance to final response.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 10}, {"color": "red", "value": 20}]}, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "id": 6,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "histogram_quantile(0.50, sum by (le) (rate(aicompanion_gateway_turn_duration_seconds_bucket[5m])))", "legendFormat": "p50", "refId": "A"}, {"expr": "histogram_quantile(0.95, sum by (le) (rate(aicompanion_gateway_turn_duration_seconds_bucket[5m])))", "legendFormat": "p95", "refId": "B"}],
          "title": "Gateway turn latency",
          "type": "timeseries"
        },
        {
          "description": "p95 contribution of each gateway stage: speech-to-text, agent/LLM, and text-to-speech.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "min": 0, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 21},
          "id": 7,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, stage) (rate(aicompanion_gateway_stage_duration_seconds_bucket[5m])))", "legendFormat": "{{stage}}", "refId": "A"}],
          "title": "Gateway stage p95 latency",
          "type": "timeseries"
        },
        {
          "description": "Current Kubernetes readiness for every aicompanion pod. A value of one means the pod is ready to serve.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "NOT READY"}, "1": {"color": "green", "text": "READY"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "none"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 30},
          "id": 8,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name", "wideLayout": true},
          "targets": [{"expr": "max by (pod) (kube_pod_status_ready{namespace=\"aicompanion\",condition=\"true\"})", "legendFormat": "{{pod}}", "refId": "A", "instant": true}],
          "title": "Pod readiness",
          "type": "stat"
        },
        {
          "description": "Container restarts observed during the last hour. Investigate any non-zero series.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "unit": "none"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 30},
          "id": 9,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=\"aicompanion\"}[1h]))", "legendFormat": "{{pod}} / {{container}}", "refId": "A"}],
          "title": "Container restarts (last hour)",
          "type": "timeseries"
        },
        {
          "description": "NVIDIA GPU utilization reported by gpu-exporter on each labeled GPU node.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 38},
          "id": 10,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "DCGM_FI_DEV_GPU_UTIL", "legendFormat": "{{hostname}} / GPU {{gpu}}", "refId": "A"}],
          "title": "GPU utilization",
          "type": "timeseries"
        },
        {
          "description": "NVIDIA framebuffer use as a percentage of total VRAM. gpu-exporter reports one series per physical GPU.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 95}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 38},
          "id": 11,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "100 * DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE + DCGM_FI_DEV_FB_RESERVED)", "legendFormat": "{{hostname}} / GPU {{gpu}}", "refId": "A"}],
          "title": "VRAM utilization",
          "type": "timeseries"
        },
        {
          "description": "VRAM held by each pod's processes (gpu-exporter, from NVML). Not reported under WSL2, so the laptop node shows none.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"stacking": {"mode": "normal"}, "fillOpacity": 30}, "unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 46},
          "id": 20,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (hostname, pod) (aicompanion_gpu_process_memory_bytes)", "legendFormat": "{{hostname}} / {{pod}}", "refId": "A"}],
          "title": "VRAM by pod",
          "type": "timeseries"
        },
        {
          "description": "SM clock, and any reason the driver is holding it down (thermal, power cap, ...). gpu_idle is left out: it only means there is no work.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "none"}, "overrides": [{"matcher": {"id": "byFrameRefID", "options": "B"}, "properties": [{"id": "custom.axisPlacement", "value": "right"}, {"id": "custom.drawStyle", "value": "bars"}, {"id": "max", "value": 1}]}]},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 46},
          "id": 21,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "aicompanion_gpu_clock_mhz{clock=\"sm\"}", "legendFormat": "{{hostname}} SM MHz", "refId": "A"},
            {"expr": "aicompanion_gpu_throttle{reason!=\"gpu_idle\"} == 1", "legendFormat": "{{hostname}} throttled: {{reason}}", "refId": "B"}
          ],
          "title": "GPU clock and throttling",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "tempo", "uid": "tempo"},
          "description": "Distributed traces emitted by the FastAPI services through OpenTelemetry and stored in Tempo.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 54},
          "id": 12,
          "options": {"showSearch": true, "showTable": true, "spanBar": {"type": "Tag"}},
          "targets": [{"queryType": "traceql", "query": "{ resource.service.name =~ \".+\" }", "refId": "A"}],
          "title": "Recent distributed traces",
          "type": "traces"
        },
        {
          "description": "Estimated ElevenLabs credits used in the selected 30-day window. This assumes one credit per character.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 64},
          "id": 13,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name"},
          "targets": [{"expr": "sum(increase(elevenlabs_characters_total[30d]))", "legendFormat": "estimated credits", "refId": "A"}],
          "title": "ElevenLabs credits used (estimated)",
          "type": "stat"
        },
        {
          "description": "Estimated remaining ElevenLabs credits, initialized from the configured account balance.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 1000}, {"color": "green", "value": 3000}]}, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 64},
          "id": 14,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name"},
          "targets": [{"expr": "sum(elevenlabs_credits_remaining_estimate)", "legendFormat": "estimated credits remaining", "refId": "A"}],
          "title": "ElevenLabs credits remaining (estimated)",
          "type": "stat"
        },
        {
          "description": "The Stick's own battery report, once a minute while it is connected (gaps: it wasn't). Drain is the %/hour slope over 30 minutes: compare it across firmware builds.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "percent", "min": 0, "max": 100}, "overrides": [
            {"matcher": {"id": "byFrameRefID", "options": "B"}, "properties": [{"id": "unit", "value": "volt"}, {"id": "custom.axisPlacement", "value": "right"}, {"id": "min", "value": 3.2}, {"id": "max", "value": 4.3}]},
            {"matcher": {"id": "byFrameRefID", "options": "C"}, "properties": [{"id": "custom.drawStyle", "value": "bars"}, {"id": "unit", "value": "none"}, {"id": "max", "value": 1}]},
            {"matcher": {"id": "byFrameRefID", "options": "D"}, "properties": [{"id": "unit", "value": "none"}, {"id": "custom.axisPlacement", "value": "right"}, {"id": "min", "value": null}, {"id": "max", "value": null}]}
          ]},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 70},
          "id": 22,
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull"]}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "aicompanion_stick_battery_percent", "legendFormat": "battery %", "refId": "A"},
            {"expr": "aicompanion_stick_battery_volts", "legendFormat": "voltage", "refId": "B"},
            {"expr": "aicompanion_stick_charging", "legendFormat": "charging", "refId": "C"},
            {"expr": "-deriv(aicompanion_stick_battery_percent[30m]) * 3600 and aicompanion_stick_charging == 0", "legendFormat": "drain %/hour", "refId": "D"}
          ],
          "title": "Stick battery",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 41,
      "tags": ["aicompanion", "operations"],
      "time": {"from": "now-15m", "to": "now"},
      "title": "AI Companion / Service Performance",
      "version": 3
    }
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-provider, namespace: aicompanion}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: aicompanion
        folder: AI Companion
        type: file
        options: {path: /var/lib/grafana/dashboards}
