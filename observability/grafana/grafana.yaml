apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: aicompanion
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: aicompanion}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          env: [{name: GF_SECURITY_ADMIN_PASSWORD, value: admin}]
          ports: [{containerPort: 3000, name: http}]
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: datasource, configMap: {name: grafana-datasource}}
        - {name: dashboard-provider, configMap: {name: grafana-dashboard-provider}}
        - {name: dashboard, configMap: {name: grafana-dashboard-aicompanion}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: aicompanion}
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
