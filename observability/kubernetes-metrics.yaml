# Kubernetes object state (readiness, restarts, and rollout state), limited to
# the aicompanion namespace.  Prometheus discovers its named metrics Service.
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: aicompanion}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kube-state-metrics, namespace: aicompanion}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kube-state-metrics, namespace: aicompanion}
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: aicompanion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: aicompanion}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      nodeSelector: {gpu-tier: gtx1650}
      priorityClassName: monitoring
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args: ["--namespaces=aicompanion", "--resources=pods,deployments"]
          ports:
            - {containerPort: 8080, name: metrics}
            - {containerPort: 8081, name: telemetry}
          # Measured ~19Mi (2026-09-23).
          resources:
            requests: {memory: 32Mi}
            limits: {memory: 128Mi}
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: aicompanion}
spec:
  selector: {app: kube-state-metrics}
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
---
# One GPU exporter per GPU node: services/gpu_exporter/exporter.py, reading
# NVML at scrape time. It replaced NVIDIA's dcgm-exporter (2026-09-24), which
# embeds the DCGM host engine and held ~405 MiB of anonymous memory on arch-ssd
# to export six numbers; this measured 37 MiB. It keeps the DCGM_FI_DEV_* names
# and labels the dashboard, obs_tui.py and the agent's GPU tool read (a test in
# tests/test_observability.py keeps them in step), and adds clocks, throttle
# reasons, energy, XID errors and VRAM per pod.
#
# It uses the NVIDIA runtime to reach NVML without consuming a time-sliced
# nvidia.com/gpu slot. VRAM per pod needs the host's /proc (NVML reports host
# PIDs) and /var/log/pods (pod names by UID; root-only on the host, hence
# runAsUser 0 with every capability dropped and a read-only filesystem).
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: gpu-exporter, namespace: aicompanion}
spec:
  selector: {matchLabels: {app: gpu-exporter}}
  template:
    metadata: {labels: {app: gpu-exporter}}
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu-tier
                    operator: In
                    values: [gtx1650, rtx4060]
                  # tools/lean-mode.sh labels a node with this to pause the
                  # exporter on that node only (deep/max levels). Unlabelled
                  # nodes match as before.
                  - key: aicompanion/monitoring-paused
                    operator: NotIn
                    values: ["true"]
      priorityClassName: monitoring
      runtimeClassName: nvidia
      containers:
        - name: gpu-exporter
          image: ghcr.io/adixg/aicompanion-gpu-exporter:latest
          imagePullPolicy: Always
          env:
            - {name: NVIDIA_VISIBLE_DEVICES, value: all}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: utility}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {containerPort: 9400, name: metrics}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 3
            periodSeconds: 30
          # Measured 37 MiB RSS on arch-ssd (2026-09-24).
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: host-proc, mountPath: /host/proc, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
      volumes:
        - name: host-proc
          hostPath: {path: /proc, type: Directory}
        - name: pod-logs
          hostPath: {path: /var/log/pods, type: Directory}
---
apiVersion: v1
kind: Service
metadata: {name: gpu-exporter, namespace: aicompanion}
spec:
  selector: {app: gpu-exporter}
  ports:
    - {name: metrics, port: 9400, targetPort: metrics}
