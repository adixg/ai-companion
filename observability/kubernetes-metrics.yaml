# Kubernetes object state (readiness, restarts, and rollout state), limited to
# the aicompanion namespace.  Prometheus discovers its named metrics Service.
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: aicompanion}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kube-state-metrics, namespace: aicompanion}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kube-state-metrics, namespace: aicompanion}
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: aicompanion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: aicompanion}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      nodeSelector: {gpu-tier: gtx1650}
      priorityClassName: monitoring
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args: ["--namespaces=aicompanion", "--resources=pods,deployments"]
          ports:
            - {containerPort: 8080, name: metrics}
            - {containerPort: 8081, name: telemetry}
          # Measured ~19Mi (2026-09-23).
          resources:
            requests: {memory: 32Mi}
            limits: {memory: 128Mi}
          livenessProbe:
            httpGet: {path: /livez, port: metrics}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: aicompanion}
spec:
  selector: {app: kube-state-metrics}
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
---
# One DCGM exporter per GPU node. The NVIDIA runtime and pod-resources socket
# let it report GPU utilization and framebuffer use without consuming a
# time-sliced nvidia.com/gpu workload slot.
#
# Only the six fields something here reads (obs_tui.py, the Grafana dashboard,
# companion_control_mcp.py; tests/test_observability.py keeps this list and
# theirs in step), collected every 15 s to match the Prometheus scrape instead
# of the default ~15 fields every second. This cuts the exporter's work, NOT its
# memory: it held ~405 MiB of anonymous memory on arch-ssd before and 408 MiB
# after (measured 2026-09-24) -- that is the embedded DCGM host engine itself.
apiVersion: v1
kind: ConfigMap
metadata: {name: dcgm-exporter-counters, namespace: aicompanion}
data:
  counters.csv: |
    # DCGM field, Prometheus type, help
    DCGM_FI_DEV_GPU_UTIL,     gauge, GPU utilization (in %).
    DCGM_FI_DEV_FB_USED,      gauge, Framebuffer memory used (in MiB).
    DCGM_FI_DEV_FB_FREE,      gauge, Framebuffer memory free (in MiB).
    DCGM_FI_DEV_FB_RESERVED,  gauge, Framebuffer memory reserved (in MiB).
    DCGM_FI_DEV_GPU_TEMP,     gauge, GPU temperature (in C).
    DCGM_FI_DEV_POWER_USAGE,  gauge, Power draw (in W).
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: dcgm-exporter, namespace: aicompanion}
spec:
  selector: {matchLabels: {app: dcgm-exporter}}
  template:
    metadata: {labels: {app: dcgm-exporter}}
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu-tier
                    operator: In
                    values: [gtx1650, rtx4060]
                  # tools/lean-mode.sh labels a node with this to free the
                  # exporter's ~430Mi on that node only, leaving the other
                  # node's exporter running. Unlabelled nodes match as before.
                  - key: aicompanion/monitoring-paused
                    operator: NotIn
                    values: ["true"]
      priorityClassName: monitoring
      runtimeClassName: nvidia
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless
          env:
            - {name: DCGM_EXPORTER_LISTEN, value: ":9400"}
            - {name: DCGM_EXPORTER_KUBERNETES, value: "true"}
            - {name: DCGM_EXPORTER_COLLECTORS, value: /etc/dcgm-exporter/custom/counters.csv}
            - {name: DCGM_EXPORTER_INTERVAL, value: "15000"}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {containerPort: 9400, name: metrics}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 200m, memory: 512Mi}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities: {add: [SYS_ADMIN], drop: [ALL]}
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: pod-gpu-resources, mountPath: /var/lib/kubelet/pod-resources, readOnly: true}
            - {name: counters, mountPath: /etc/dcgm-exporter/custom, readOnly: true}
      volumes:
        - name: counters
          configMap: {name: dcgm-exporter-counters}
        - name: pod-gpu-resources
          hostPath: {path: /var/lib/kubelet/pod-resources, type: Directory}
---
apiVersion: v1
kind: Service
metadata: {name: dcgm-exporter, namespace: aicompanion}
spec:
  selector: {app: dcgm-exporter}
  ports:
    - {name: metrics, port: 9400, targetPort: metrics}
