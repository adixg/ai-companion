apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: aicompanion}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus-discovery, namespace: aicompanion}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus-discovery, namespace: aicompanion}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: aicompanion}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aicompanion
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: aicompanion-services
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: {names: [aicompanion]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: gateway|stt|agent|tts|kube-state-metrics|dcgm-exporter
            action: keep
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data-arch, namespace: aicompanion}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aicompanion
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      nodeSelector: {gpu-tier: gtx1650}
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.7.3
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{containerPort: 9090, name: http}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, persistentVolumeClaim: {claimName: prometheus-data-arch}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: aicompanion}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
