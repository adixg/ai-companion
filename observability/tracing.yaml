apiVersion: v1
kind: ConfigMap
metadata: {name: tempo-config, namespace: aicompanion}
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server: {http_listen_port: 3200}
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: "0.0.0.0:4317"}
    storage:
      trace:
        backend: local
        wal: {path: /var/tempo/wal}
        local: {path: /var/tempo/blocks}
    usage_report: {reporting_enabled: false}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: tempo-data-arch, namespace: aicompanion}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tempo, namespace: aicompanion}
spec:
  replicas: 1
  selector: {matchLabels: {app: tempo}}
  template:
    metadata: {labels: {app: tempo}}
    spec:
      nodeSelector: {gpu-tier: gtx1650}
      containers:
        - name: tempo
          image: grafana/tempo:2.7.2
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports: [{name: http, containerPort: 3200}, {name: otlp-grpc, containerPort: 4317}]
          volumeMounts: [{name: config, mountPath: /etc/tempo}, {name: data, mountPath: /var/tempo}]
      volumes: [{name: config, configMap: {name: tempo-config}}, {name: data, persistentVolumeClaim: {claimName: tempo-data-arch}}]
---
apiVersion: v1
kind: Service
metadata: {name: tempo, namespace: aicompanion}
spec:
  selector: {app: tempo}
  ports: [{name: http, port: 3200, targetPort: http}, {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}]
